# The name of our workflow
name: Build
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      riskThreshold:
        description: "Risk Threshold"
        required: false
        default: CRITICAL

permissions:
  contents: write
  pull-requests: write

env:
  RISK_THRESHOLD: CRITICAL
  APPKNOX_ACCESS_TOKEN: 12113443ec9b5c141adc459f9afec11830d709d4
  APPKNOX_API_HOST: https://autofix.staging.appknox.io/
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set risk threshold for push
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "RISK_THRESHOLD=${{ env.RISK_THRESHOLD }}" >> $GITHUB_ENV
      - name: Set risk threshold for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "RISK_THRESHOLD=${{ github.event.inputs.riskThreshold }}" >> $GITHUB_ENV
      # Runs before the JDK 8 setup: sdkmanager needs the runner's default JDK 17+
      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" \
            "platforms;android-29" \
            "build-tools;29.0.3" \
            "cmake;3.6.4111459" \
            "ndk;21.0.6113669"
      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: temurin
      # gradle-wrapper.jar is not committed (*.jar is gitignored), so ./gradlew cannot run.
      # Install the Gradle version pinned in gradle-wrapper.properties and call it directly.
      - name: Set up Gradle 6.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "6.1.1"
      # Fix dependencies that no longer resolve now that JCenter is gone:
      # - volley 1.1.1 was JCenter-only; 1.2.1 is on Maven Central (not listed by the project)
      # - passcodeview 0.1.2 is not published anywhere and is unused by the app
      - name: Create Gradle init script fixing dependencies
        run: |
          cat > "$RUNNER_TEMP/pin-deps.gradle" <<'EOF'
          allprojects {
              repositories {
                  mavenCentral()
              }
              configurations.all {
                  exclude group: 'com.hanks', module: 'passcodeview'
                  resolutionStrategy {
                      force 'com.android.volley:volley:1.2.1'
                  }
              }
          }
          EOF
      - name: Build the app
        working-directory: DamnVulnerableBank
        timeout-minutes: 30
        run: gradle bundleDebug --no-daemon -I "$RUNNER_TEMP/pin-deps.gradle"
      - uses: actions/upload-artifact@v4
        with:
          name: dvba.aab
          path: DamnVulnerableBank/app/build/outputs/bundle/debug/app-debug.aab
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Checkout appknox-go
        uses: actions/checkout@v4
        with:
          repository: appknox/appknox-go
          ref: feature/knoxfixer
          path: appknox-go
      - name: Build appknox CLI
        working-directory: appknox-go
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          go build -o "$GITHUB_WORKSPACE/bin/appknox" .
      - name: Upload app and run Appknox cicheck
        id: appknox_scan
        continue-on-error: true
        run: |
          FILE_ID=$(./bin/appknox upload DamnVulnerableBank/app/build/outputs/bundle/debug/app-debug.aab --knoxiq)
          echo "Uploaded file id: $FILE_ID"
          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
          ./bin/appknox cicheck "$FILE_ID" --risk-threshold "${RISK_THRESHOLD}"
      - name: Run Appknox autofix
        if: steps.appknox_scan.outputs.file_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APPKNOX=./bin/appknox
          FILE_ID="${{ steps.appknox_scan.outputs.file_id }}"
          $APPKNOX knoxfixer --file-id "$FILE_ID"
      - name: Fail if cicheck found issues
        if: steps.appknox_scan.outcome == 'failure'
        run: exit 1
